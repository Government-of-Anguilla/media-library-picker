<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Media Library Picker — Demo</title>
	<link rel="stylesheet" href="../src/media-library.css" />
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			background: #e9eaf2;
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.demo-card {
			background: #fff;
			border-radius: 16px;
			padding: 40px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			text-align: center;
		}
		button#open-picker {
			font-family: inherit;
			font-size: 14px;
			font-weight: 600;
			padding: 10px 20px;
			border-radius: 9999px;
			border: 0;
			background: #12172b;
			color: #fff;
			cursor: pointer;
		}
		pre {
			text-align: left;
			background: #f4f4fa;
			padding: 14px;
			border-radius: 10px;
			max-width: 480px;
			overflow: auto;
			font-size: 12px;
		}
	</style>
</head>
<body>
	<div class="demo-card">
		<h1>Media Library Picker</h1>
		<p>No backend configured — running in built-in demo-data mode.</p>
		<button id="open-picker" type="button">Open Media Library</button>
		<p>Last inserted:</p>
		<pre id="result">(nothing yet)</pre>
	</div>

	<script src="../src/media-library-core.js"></script>
	<script src="../src/media-library-picker.js"></script>
	<script>
		const picker = new MediaLibraryPicker({
			multiple: false,
			filters: ['image', 'document', 'audio', 'video'],
			triggers: ['#open-picker'],
			endpoints: {
				// list: '/api/media',
				// upload: '/api/media/upload',
				// delete: '/api/media/:id',
				// detail: '/api/media/:id',
			},
			callbacks: {
				onInsert: (item) => {
					document.getElementById('result').textContent = JSON.stringify(item, null, 2);
				},
				onDelete: (item) => console.log('deleted', item),
				onUploadComplete: (record) => console.log('uploaded', record),
			},
		});
	</script>
</body>
</html>
